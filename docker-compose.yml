# Docker Compose para METTAV
# Ideal para desplegar en Coolify (lee este archivo automáticamente desde la raíz del repo).
#
# Variables de entorno opcionales (configúralas como "Variables" en Coolify):
#   SECRET_KEY     -> clave secreta de Flask. Si se deja vacía, la app genera una
#                     aleatoria y la guarda en el volumen de datos (instance/).
#   ADMIN_USER     -> nombre del primer administrador (por defecto: admin)
#   ADMIN_PASSWORD -> contraseña del primer administrador; solo se usa si ese
#                     usuario todavía no existe en la base de datos
#   DATABASE_URL   -> base de datos PostgreSQL (vacía = SQLite en el volumen)
#   GEMINI_KEY     -> clave de Google AI Studio para el asistente con IA
#                     (dentro del contenedor la app la lee como GEMINI_API_KEY)
#   GEMINI_MODEL   -> modelo de Gemini (por defecto: gemini-3.5-flash)
#
# Este archivo NO publica puertos del host: Coolify rutea el tráfico desde su
# proxy hacia el puerto 5000 del contenedor (configúralo en "Ports Exposes").
# Si quieres correrlo en Docker sin Coolify, usa docker-compose.local.yml.

services:
  web:
    build:
      context: ./mi_proyecto
      dockerfile: Dockerfile
    image: mettav:latest
    container_name: mettav-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      # Detrás del proxy de Coolify: IP real del cliente y detección de HTTPS.
      TRUST_PROXY: "1"
      # Vacía = SQLite en el volumen mettav_data. Para PostgreSQL: postgresql://usuario:clave@host:5432/bd
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    # Coolify expone el servicio a través de su propio proxy (dominio + HTTPS),
    # así que NO se publica ningún puerto del host. De lo contrario aparece:
    #   Bind for :::8000 failed: port is already allocated
    # En Coolify, configura "Ports Exposes" = 5000.
    expose:
      - "5000"
    volumes:
      # Persistencia de la base de datos SQLite
      - mettav_data:/app/instance
      # Persistencia de las imágenes SUBIDAS por los usuarios.
      # Se montan solo las dos subcarpetas: si se montara /static/images entero,
      # un volumen vacío taparía el logo y el fondo que vienen en la imagen.
      - mettav_profiles:/app/mi_app/static/images/profiles
      - mettav_inventory:/app/mi_app/static/images/inventory
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mettav_data:
  mettav_profiles:
  mettav_inventory: