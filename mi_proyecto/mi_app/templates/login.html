<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acceso al sistema de gestión METTAV Group SAS">
    <title>Iniciar sesión | METTAV Group SAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<main class="login-page">
    <div class="bg-overlay"></div>

    <section class="login-card" aria-labelledby="brand-heading">
        <header class="brand">
            <img class="brand__logo" src="{{ url_for('static', filename='images/mettav-logo.png') }}" alt="METTAV Logo">
            <h1 id="brand-heading" class="brand__name">METTAV</h1>
            <p class="brand__sub">GROUP SAS</p>
        </header>

        <form
            class="login-form"
            id="auth-form"
            data-login-url="{{ url_for('usuarios.iniciar_sesion') }}"
            data-dashboard-url="{{ url_for('main.dashboard') }}"
            autocomplete="on"
        >
            <div class="field-group">
                <label class="field-label" for="username">
                    <img class="label-icon" src="{{ url_for('static', filename='images/user.svg') }}" alt="" aria-hidden="true">
                    <span>Nombre de Usuario</span>
                </label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <img src="{{ url_for('static', filename='images/user.svg') }}" alt="" aria-hidden="true">
                    </span>
                    <input id="username" name="usuario" type="text" maxlength="80" autocomplete="username" required>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="password">
                    <img class="label-icon" src="{{ url_for('static', filename='images/lock.svg') }}" alt="" aria-hidden="true">
                    <span>Contraseña</span>
                </label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <img src="{{ url_for('static', filename='images/lock.svg') }}" alt="" aria-hidden="true">
                    </span>
                    <input id="password" name="contrasena" type="password" placeholder="••••••••••" autocomplete="current-password" required>
                    <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                        <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-label">
                    <input type="checkbox" name="remember">
                    <span>Recordar Usuario</span>
                </label>
            </div>

            <p class="form-message" id="form-message" role="status" aria-live="polite" hidden></p>
            <button class="btn-login" id="submit-button" type="submit">INICIAR SESIÓN</button>
        </form>

    </section>
</main>
<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
