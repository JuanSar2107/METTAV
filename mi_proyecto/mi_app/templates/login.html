{% extends "base.html" %}

{% block title %}Iniciar sesión | METTAV Group SAS{% endblock %}

{% block content %}
<main class="login-page">
    <div class="background-overlay"></div>

    <section class="login-panel" aria-labelledby="brand-name">
        <header class="brand">
            <img class="brand__mark" src="{{ url_for('static', filename='images/mettav-logo.png') }}" alt="METTAV Logo">
            <h1 id="brand-name">METTAV</h1>
            <p>GROUP SAS</p>
        </header>

        <form class="login-form">
            <div class="field-group">
                <label class="field-label" for="username">
                    <img class="label-icon" src="{{ url_for('static', filename='images/user.svg') }}" alt="" aria-hidden="true">
                    <span>Nombre de Usuario</span>
                </label>
                <div class="input-wrap">
                    <div class="input-icon-box">
                        <img src="{{ url_for('static', filename='images/user.svg') }}" alt="" aria-hidden="true">
                    </div>
                    <input id="username" name="username" type="text" value="admin.mettav" autocomplete="username">
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="password">
                    <img class="label-icon" src="{{ url_for('static', filename='images/lock.svg') }}" alt="" aria-hidden="true">
                    <span>Contraseña</span>
                </label>
                <div class="input-wrap">
                    <div class="input-icon-box">
                        <img src="{{ url_for('static', filename='images/lock.svg') }}" alt="" aria-hidden="true">
                    </div>
                    <input id="password" name="password" type="password" value="secretpassword" placeholder="••••••••••" autocomplete="current-password">
                </div>
            </div>

            <div class="form-options">
                <label class="remember-option">
                    <input type="checkbox" name="remember">
                    <span>Recordar Usuario</span>
                </label>
                <a href="#" class="link-secondary">Olvidé mi contraseña?</a>
            </div>

            <button class="submit-button" type="button">INICIAR SESIÓN</button>
        </form>

        <footer class="login-footer">
            <a href="#" class="link-footer">Registrar nueva cuenta</a>
            <span class="footer-divider" aria-hidden="true">/</span>
            <a href="#" class="link-footer">Soporte Técnico</a>
        </footer>
    </section>
</main>
{% endblock %}
